<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Instituto Tecnológico Centro Infantil Don Bosquito</title>
    <link rel="stylesheet" href="Assets/css/bootstrap.min.css">
<link rel="stylesheet" href="Assets/colores.css">
<link rel="shortcut icon" href="Assets/img/logodb2.png">


</head>
<body class="sidebar-dark-blue2">
    <div class="container">
        <div class="row mt-3">
            <div class="col-lg-4 m-auto">
                <div class="card mt-5">
                    <div class="card-header text-center sidebar-dark-suave">
                        <strong class="text-white">Iniciar Sesión</strong><br>
                        <img src="Assets/img/logodb2.png" width="170" alt="Logo Don Bosquito">
                    </div>
                    <div class="card-body">
                        <form action="pestañas/dashboard.html" method="get" autocomplete="off">
                            <div class="form-group">
                                <strong class="text-primary">Usuario</strong>
                                <input id="usuario" class="form-control" type="text" name="usuario" placeholder="Usuario">
                            </div>
                            <div class="form-group">
                                <strong class="text-primary">Contraseña</strong>
                                <input id="clave" class="form-control" type="password" name="clave" placeholder="Contraseña">
                            </div>
                            <button class="btn btn-primary btn-block" type="submit">Iniciar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="Assets/js/jquery.min.js"></script>
    <script src="Assets/js/bootstrap.bundle.min.js"></script>
</body>
</html>
